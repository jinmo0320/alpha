services:
  # 데이터베이스
  db:
    image: mysql:8.0.43
    container_name: mysql-container
    restart: always
    environment:
      # .env의 DB 값을 MySQL 컨테이너 초기 설정에 사용
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    ports:
      # DB 포트는 EC2 내부에서만 접근 가능하게 제한
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    command:
      - --skip-character-set-client-handshake
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 컨테이너를 다시 만들어도 DB 데이터 유지
      - mysql_data:/var/lib/mysql
      # 최초 DB 생성 시 초기화 SQL 실행
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d:ro

  # 서버
  torium-server:
    build:
      context: .
    # 운영 배포에서는 ECR 이미지, 로컬에서는 기본 이미지 사용
    image: ${TORIUM_IMAGE:-torium-server:latest}
    container_name: torium-server
    ports:
      # 서버 포트도 로컬/프록시에서만 접근 가능하게 제한
      - "127.0.0.1:${HOST_PORT:-3000}:${CONTAINER_PORT:-3000}"
    env_file:
      - .env
    environment:
      # docker의 db container로 MySQL에 접속
      DB_HOST: db
      DB_USER: root
      DB_PORT: 3306
    restart: always
    depends_on:
      - db

volumes:
  mysql_data:
