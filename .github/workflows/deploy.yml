name: Deploy to EC2 via SSM

on:
  push:
    branches: [main]

jobs:
  # 1. 빌드 및 ECR 푸시
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_URI: ${{ secrets.AWS_ECR_URI }}
      IMAGE_REPO: prod/torium-repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push docker image
        env:
          ECR_URI: ${{ secrets.AWS_ECR_URI }}
          IMAGE_REPO: prod/torium-repo
        run: |
          IMAGE_TAG=latest
          BUILD_TAG=${GITHUB_RUN_NUMBER:-${GITHUB_RUN_ID}}
          FULL_IMAGE="${ECR_URI}/${IMAGE_REPO}"
          # Build
          docker build --build-arg NODE_ENV=production -t ${FULL_IMAGE}:${IMAGE_TAG} .
          docker tag ${FULL_IMAGE}:${IMAGE_TAG} ${FULL_IMAGE}:${BUILD_TAG}
          # Push both tags
          docker push ${FULL_IMAGE}:${IMAGE_TAG}
          docker push ${FULL_IMAGE}:${BUILD_TAG}

  # 2. SSM을 통한 배포
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      ECR_URI: ${{ secrets.AWS_ECR_URI }}
      IMAGE_REPO: prod/torium-repo
      HOST_PORT: 3000 # EC2에서 열어줄 포트
      CONTAINER_PORT: 3000 # Node.js 앱이 사용하는 포트

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          # EC2로 보낼 docker-compose.yml과 initdb.d 파일을 하나로 묶음
          DEPLOY_BUNDLE=$(tar -czf - docker-compose.yml mysql/initdb.d | base64 -w 0)

          # EC2에서 실행할 로직을 파일로 먼저 작성
          cat <<EOF > deploy_script.sh
          #!/bin/bash
          set -e # 에러 발생 시 즉시 중단

          # Compose가 사용할 배포 파일을 고정된 위치에 둠
          DEPLOY_DIR="\$HOME/torium-server"
          mkdir -p "\$DEPLOY_DIR"
          cd "\$DEPLOY_DIR"

          # ECR 로그인
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_URI

          # Parameter Store에서 .env 안전하게 가져오기
          aws ssm get-parameter --name "/torium/prod/env" --with-decryption --query "Parameter.Value" --output text > .env
          # Compose가 ECR 서버 이미지를 사용하도록 이미지 주소 주입
          printf '\nTORIUM_IMAGE=%s\n' "$ECR_URI/$IMAGE_REPO:latest" >> .env
          # 포트 값은 workflow env를 Compose env로 전달
          printf 'HOST_PORT=%s\nCONTAINER_PORT=%s\n' "$HOST_PORT" "$CONTAINER_PORT" >> .env

          # Compose 파일과 MySQL 초기화 SQL 배치
          printf '%s' "$DEPLOY_BUNDLE" | base64 -d | tar -xzf - -C "\$DEPLOY_DIR"

          # EC2에 설치된 Compose 버전에 맞춰 명령 선택
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "Docker Compose is not installed on the EC2 instance."
            exit 1
          fi

          # Docker 배포
          docker pull $ECR_URI/$IMAGE_REPO:latest
          # 서버와 MySQL 컨테이너를 Compose로 함께 실행
          \$COMPOSE up -d --no-build

          # 정리
          docker image prune -f
          EOF

          # 작성된 스크립트 파일을 Base64로 인코딩 (줄바꿈 제거)
          ENCODED_COMMAND=$(base64 -w 0 deploy_script.sh)

          # SSM 명령 전송
          echo "Sending deployment command to EC2..."

          SH_COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --comment "Deploying Node.js App via Encoded Script" \
            --parameters "commands=echo $ENCODED_COMMAND | base64 -d | bash" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $SH_COMMAND_ID"

          # 배포 결과 확인 (Polling)
          echo "Waiting for command execution..."
          sleep 2 

          aws ssm wait command-executed \
            --command-id "$SH_COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$SH_COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
            
          echo "Deployment Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment Failed"
            # 실패 시 상세 로그 출력 (디버깅용)
            aws ssm get-command-invocation \
              --command-id "$SH_COMMAND_ID" \
              --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
